# Redis configuration for Adaptive Trading System
# Optimized for a 12-core, 15GB system running trading workloads

# Network
bind 127.0.0.1
port 6379
protected-mode yes
tcp-backlog 511
tcp-keepalive 300

# General
daemonize yes
supervised systemd
pidfile /var/run/redis/redis-server.pid
loglevel notice
logfile /home/creekz/Projects/Shady_Trader/logs/redis.log

# Memory Management
# Use ~2GB max memory for Redis on this 15GB system
maxmemory 2gb
maxmemory-policy allkeys-lru

# Persistence - RDB (slower but uses less disk)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename trading-system.rdb
dir /home/creekz/Projects/Shady_Trader/data

# AOF - Append Only File (better durability)
appendonly yes
appendfilename "trading-system.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Replication
replica-serve-stale-data yes
replica-read-only yes

# Clients
maxclients 10000

# Memory efficiency
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
set-max-intset-entries 512

# Lazy freeing
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Latency monitoring
latency-monitor-threshold 100

# Event notification (for keyspace notifications)
notify-keyspace-events ""

# Advanced config
lazyfree-lazy-eviction yes
activerehashing yes
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60