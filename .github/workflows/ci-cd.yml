name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: shady_trader_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    - name: Run tests with SQLite
      run: npm test
      env:
        USE_POSTGRES: false

    - name: Run tests with PostgreSQL
      run: npm test
      env:
        USE_POSTGRES: true
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        POSTGRES_DB: shady_trader_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_MAX_CONNECTIONS: 5

    - name: Run coverage tests
      run: npm run quality:coverage

    - name: Run complexity check
      run: npm run quality:complexity

    - name: Run Freqtrade validation gate
      run: |
        echo "Checking Freqtrade integration state..."
        # Verify the backtest service compiles
        npx tsx -e "
          import('./backend/backtest/service.js').then(m => {
            console.log('backtest/service.ts: OK');
          }).catch(e => { console.error('FAIL:', e.message); process.exit(1); });
        "
        # Verify the validate worker compiles
        npx tsx -e "
          import('./backend/freqtrade/workers/validateWorker.js').then(m => {
            console.log('validateWorker.ts: OK');
          }).catch(e => { console.error('FAIL:', e.message); process.exit(1); });
        "
        echo "Freqtrade validation gate passed."

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Build Docker image
      run: docker build -t shady-trader:${{ github.sha }} .

    - name: Login to Docker Hub
      if: github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push Docker image
      if: github.ref == 'refs/heads/main'
      run: |
        docker tag shady-trader:${{ github.sha }} shady-trader:latest
        docker push shady-trader:latest

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    steps:
    - uses: actions/checkout@v4

    - name: Configure kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

    - name: Deploy to staging
      run: |
        kubectl apply -f k8s/configmap.yaml
        kubectl apply -f k8s/secret.yaml
        kubectl apply -f k8s/pvc.yaml
        kubectl apply -f k8s/service.yaml
        kubectl apply -f k8s/deployment.yaml
        kubectl set image deployment/shady-trader-app shady-trader=shady-trader:${{ github.sha }}

    - name: Run health check
      run: |
        kubectl wait --for=condition=available --timeout=300s deployment/shady-trader-app
        kubectl wait --for=condition=available --timeout=300s deployment/shady-trader-postgres

  deploy-production:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Configure kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

    - name: Deploy to production
      run: |
        kubectl apply -f k8s/configmap.yaml
        kubectl apply -f k8s/secret.yaml
        kubectl apply -f k8s/pvc.yaml
        kubectl apply -f k8s/service.yaml
        kubectl apply -f k8s/deployment.yaml
        kubectl set image deployment/shady-trader-app shady-trader=shady-trader:latest

    - name: Run health check
      run: |
        kubectl wait --for=condition=available --timeout=300s deployment/shady-trader-app
        kubectl wait --for=condition=available --timeout=300s deployment/shady-trader-postgres