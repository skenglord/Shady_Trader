apiVersion: apps/v1
kind: Deployment
metadata:
  name: shady-trader-redis
  labels:
    app: shady-trader
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shady-trader
      component: redis
  template:
    metadata:
      labels:
        app: shady-trader
        component: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        command: ["redis-server", "--appendonly", "yes"]
        volumeMounts:
        - name: redis-data
          mountPath: /data
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: shady-trader-redis
  labels:
    app: shady-trader
    component: redis
spec:
  selector:
    app: shady-trader
    component: redis
  ports:
  - port: 6379
    targetPort: 6379
  clusterIP: None