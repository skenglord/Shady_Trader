version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - shady-trader

  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_DB: shady_trader
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shady_trader"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - redis
    networks:
      - shady-trader

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      LIVE_TRADING_ENABLED: 'false'
      FREQTRADE_ENABLED: ${FREQTRADE_ENABLED:-false}
      FREQTRADE_QUEUE_CONCURRENCY: ${FREQTRADE_QUEUE_CONCURRENCY:-1}
      FREQTRADE_API_USER: ${FREQTRADE_API_USER:-}
      FREQTRADE_API_PASS: ${FREQTRADE_API_PASS:-}
      FREQTRADE__API_SERVER__JWT_SECRET_KEY: ${FREQTRADE_JWT_SECRET_KEY:-}
      EXCHANGE_NAME: ${EXCHANGE_NAME:-binance}
      EXCHANGE_API_KEY: ${EXCHANGE_API_KEY:-${BINANCE_API_KEY:-}}
      EXCHANGE_API_SECRET: ${EXCHANGE_API_SECRET:-${BINANCE_SECRET_KEY:-}}
      EXCHANGE_API_PASSWORD: ${EXCHANGE_API_PASSWORD:-}
      USE_POSTGRES: 'true'
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: shady_trader
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MAX_CONNECTIONS: 10
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: llama3
      BINANCE_API_KEY: ${BINANCE_API_KEY}
      BINANCE_SECRET_KEY: ${BINANCE_SECRET_KEY}
      KRAKEN_API_KEY: ${KRAKEN_API_KEY}
      KRAKEN_PRIVATE_KEY: ${KRAKEN_PRIVATE_KEY}
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shady-trader
    volumes:
      - .:/app
      - /app/node_modules
      - freqtrade_venv:/app/backend/freqtrade/venv
      - freqtrade_data:/app/backend/freqtrade/user_data/data
    command: npm run dev

  freqtrade:
    profiles: ["freqtrade"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      LIVE_TRADING_ENABLED: 'false'
      FREQTRADE_API_USER: ${FREQTRADE_API_USER:-}
      FREQTRADE_API_PASS: ${FREQTRADE_API_PASS:-}
      FREQTRADE__API_SERVER__JWT_SECRET_KEY: ${FREQTRADE_JWT_SECRET_KEY:-}
      FREQTRADE__API_SERVER__LISTEN_IP_ADDRESS: 0.0.0.0
      FREQTRADE__API_SERVER__LISTEN_PORT: '8081'
      FREQTRADE__EXCHANGE__NAME: ${FREQTRADE__EXCHANGE__NAME:-${EXCHANGE_NAME:-binance}}
      FREQTRADE__EXCHANGE__KEY: ${FREQTRADE__EXCHANGE__KEY:-${EXCHANGE_API_KEY:-${BINANCE_API_KEY:-}}}
      FREQTRADE__EXCHANGE__SECRET: ${FREQTRADE__EXCHANGE__SECRET:-${EXCHANGE_API_SECRET:-${BINANCE_SECRET_KEY:-}}}
      FREQTRADE__EXCHANGE__PASSWORD: ${FREQTRADE__EXCHANGE__PASSWORD:-${EXCHANGE_API_PASSWORD:-}}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BINANCE_API_KEY: ${BINANCE_API_KEY}
      BINANCE_SECRET_KEY: ${BINANCE_SECRET_KEY}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - shady-trader
    volumes:
      - .:/app
      - /app/node_modules
      - freqtrade_venv:/app/backend/freqtrade/venv
      - freqtrade_data:/app/backend/freqtrade/user_data/data
      - freqtrade_logs:/app/backend/freqtrade/user_data/logs
    command: bash backend/freqtrade/run_webserver.sh
    ports:
      - "127.0.0.1:${FREQTRADE_LISTEN_PORT:-8081}:8081"
    healthcheck:
      test:
        - CMD
        - /app/backend/freqtrade/venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/api/v1/ping', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  freqtrade_data:
  freqtrade_venv:
  freqtrade_logs:

networks:
  shady-trader:
    driver: bridge
