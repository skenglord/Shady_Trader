<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Adaptive Trading System — Multi-regime quantitative trading with AI-driven sentiment analysis" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Adaptive Trading System</title>
    <script>
      // Log ALL errors to console before crash
      window.onerror = function(msg, url, line, col, error) {
        console.error('WINDOW ERROR:', msg, 'line:', line, 'col:', col, 'error:', error);
        // Store in sessionStorage for later retrieval
        const errors = JSON.parse(sessionStorage.getItem('jsErrors') || '[]');
        errors.push({ msg, url, line, col, error: String(error), time: Date.now() });
        sessionStorage.setItem('jsErrors', JSON.stringify(errors.slice(-10)));
        return false; // Let default handler run too
      };
      window.onunhandledrejection = function(e) {
        console.error('UNHANDLED REJECTION:', e.reason);
        const errors = JSON.parse(sessionStorage.getItem('jsErrors') || '[]');
        errors.push({ reason: String(e.reason), time: Date.now(), type: 'rejection' });
        sessionStorage.setItem('jsErrors', JSON.stringify(errors.slice(-10)));
      };
      // Only log the error handler install in development
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        console.log('Error handler installed');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
